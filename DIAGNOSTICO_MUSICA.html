<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIMAL · Verificar audio</title><style>body{background:#101113;color:#eee;font:16px system-ui;max-width:720px;margin:24px auto;padding:16px}button{background:#ef473c;color:white;border:0;border-radius:9px;padding:14px;font:inherit;margin:6px}iframe{width:100%;height:460px;border:1px solid #444}pre{white-space:pre-wrap}p{line-height:1.5}</style><h1>Verificar audio PRIMAL</h1><p>Esta prueba usa el reproductor real de la aplicación. Sube el volumen multimedia del teléfono y pulsa Iniciar. Debes oír música y entrenador. Una señal mayor que cero confirma audio digital, pero no comprueba el altavoz físico.</p><button id="go">Iniciar prueba</button><button id="stop">Terminar</button><pre id="result">Cargando aplicación…</pre><iframe id="app" src="./index.html" allow="autoplay; camera; microphone"></iframe><script>
let meter;const frame=document.getElementById('app'),result=document.getElementById('result');
document.getElementById('go').onclick=()=>{try{const w=frame.contentWindow,d=w.document;w.PrimalHome.resetHome();d.getElementById('start').click();w.PrimalMusic.startFromGesture(true);const c=w.PrimalMusic.getContext();meter=c.createAnalyser();w.PrimalMusic.attachRecorder(c,meter);}catch(e){result.textContent=e.message;}};
document.getElementById('stop').onclick=()=>{const w=frame.contentWindow;w.document.getElementById('stop').click();w.PrimalMusic.detachRecorder();meter=null;};
setInterval(()=>{try{const w=frame.contentWindow,a=w.document.getElementById('backgroundMusic');if(!w.PrimalMusic)return;let rms=0;if(meter){const x=new Float32Array(meter.fftSize);meter.getFloatTimeDomainData(x);rms=Math.sqrt(x.reduce((s,v)=>s+v*v,0)/x.length);}result.textContent=JSON.stringify({fase:w.document.body.dataset.state,contexto:meter?w.PrimalMusic.getContext().state:'Sin iniciar',pausado:a.paused,silenciado:a.muted,segundos:+a.currentTime.toFixed(2),carga:a.readyState,error:a.error?.message||null,señalRMS:+rms.toFixed(5),archivo:a.currentSrc},null,2);}catch(e){result.textContent=e.message;}},500);
</script></html>
